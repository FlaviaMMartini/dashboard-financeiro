name: CI/CD

# Esteira: qualidade → E2E → deploy na Vercel.
# - pull request: deploy de preview (URL própria por PR)
# - push na main: deploy de produção
# Nada é publicado se qualquer verificação anterior falhar.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types e testes (100% de cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    env:
      SESSION_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'produção' || 'preview' }} (Vercel)
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    # PRs vindos de forks não têm acesso aos secrets: nesse caso o deploy é pulado.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - name: Verificar secrets da Vercel
        id: config
        run: |
          # Remove espaços e quebras de linha coladas por engano junto com os valores.
          token=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')
          org=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '[:space:]')
          project=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '[:space:]')

          if [ -z "$token" ] || [ -z "$org" ] || [ -z "$project" ]; then
            echo "::notice::Secrets da Vercel não configurados: deploy ignorado."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::add-mask::$token"
          {
            echo "VERCEL_TOKEN=$token"
            echo "VERCEL_ORG_ID=$org"
            echo "VERCEL_PROJECT_ID=$project"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Validar acesso à Vercel
        if: steps.config.outputs.enabled == 'true'
        run: |
          # A CLI consulta o time e o projeto; um token sem acesso a qualquer um
          # deles falha com a mensagem genérica "Could not retrieve Project Settings".
          check() {
            status=$(curl -s -o response.json -w '%{http_code}'               -H "Authorization: Bearer $VERCEL_TOKEN" "$2")
            if [ "$status" != "200" ]; then
              reason=$(jq -r '.error.message // "sem detalhes"' response.json)
              echo "::error title=Sem acesso ao $1 na Vercel (HTTP $status)::$reason. $3"
              exit 1
            fi
            echo "$1 OK: $(jq -r '.name // .slug' response.json)"
          }
          check "time" "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID"             "Recrie o VERCEL_TOKEN com Scope no time do projeto e acesso completo (não restrito a projetos)."
          check "projeto" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"             "Confira VERCEL_PROJECT_ID (prj_...) e se o projeto pertence ao time informado."
      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar Vercel CLI
        if: steps.config.outputs.enabled == 'true'
        run: npm install --global vercel@latest
      - name: Baixar configuração do projeto
        if: steps.config.outputs.enabled == 'true'
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.config.outputs.enabled == 'true'
        run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        if: steps.config.outputs.enabled == 'true'
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deploy ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
